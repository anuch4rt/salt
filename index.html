<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กล่องสุ่มสลายมโน 🎁 Salt Box Simulator</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at center, #1a0b2e 0%, #090014 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Effects */
        .glow-bg {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.25) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            z-index: 1;
            text-align: center;
            max-width: 650px;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, #ff416c, #8a2387, #8e2de2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
            animation: pulseText 2s infinite ease-in-out;
        }

        .subtitle {
            color: #a78bfa;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        /* Mystery Box Styling */
        .box-stage {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 40px;
            perspective: 1000px;
            cursor: pointer;
        }

        .mystery-box {
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #2a1b4e, #160c2c);
            border-radius: 24px;
            border: 3px solid #f43f5e;
            box-shadow: 0 0 30px rgba(244, 63, 94, 0.4),
                        inset 0 0 15px rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6rem;
            position: relative;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: boxIdle 3s infinite ease-in-out;
        }

        .mystery-box::before {
            content: '?';
            position: absolute;
            font-size: 7rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.05);
        }

        .box-stage:hover .mystery-box {
            transform: scale(1.08) rotate(2deg);
            box-shadow: 0 0 50px rgba(244, 63, 94, 0.8);
            border-color: #fb7185;
        }

        /* Box Animations */
        @keyframes boxIdle {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(-1deg); }
        }

        @keyframes boxShake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-2px, -3px) rotate(-4deg); }
            20% { transform: translate(-4px, 0px) rotate(4deg); }
            30% { transform: translate(4px, 3px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(2deg); }
            50% { transform: translate(-2px, 3px) rotate(-2deg); }
            60% { transform: translate(-4px, 1px) rotate(0deg); }
            70% { transform: translate(4px, 2px) rotate(-4deg); }
            80% { transform: translate(-2px, -1px) rotate(4deg); }
            90% { transform: translate(2px, 3px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-2deg); }
        }

        .shaking {
            animation: boxShake 0.1s infinite !important;
        }

        /* Button Styling */
        .btn-open {
            background: linear-gradient(90deg, #ec4899, #8b5cf6);
            border: none;
            color: white;
            padding: 16px 48px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.5);
            transition: all 0.3s ease;
            outline: none;
            position: relative;
            overflow: hidden;
        }

        .btn-open:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(236, 72, 153, 0.7);
        }

        .btn-open:active {
            transform: translateY(1px);
        }

        .btn-open:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Modal Result Styling */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: linear-gradient(135deg, #241442, #120824);
            border: 2px solid #8b5cf6;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            transform: scale(0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 50px rgba(139, 92, 246, 0.5);
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        .prize-container {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .prize-icon {
            font-size: 6rem;
            animation: bounceIcon 1s ease infinite alternate;
        }

        .prize-img {
            max-width: 130px;
            max-height: 130px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.4));
            animation: bounceIcon 1s ease infinite alternate;
        }

        @keyframes bounceIcon {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-10px) scale(1.08); }
        }

        .prize-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .prize-desc {
            color: #cbd5e1;
            font-size: 0.95rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .btn-close {
            background: #334155;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-close:hover {
            background: #475569;
        }

        /* Rate Info Box (Dev/Visual) */
        .rate-info {
            margin-top: 40px;
            background: rgba(255, 255, 255, 0.03);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .rate-list {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .rate-item {
            background: rgba(0,0,0,0.4);
            padding: 5px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .rate-img-thumb {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        canvas#confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }
    </style>
</head>
<body>

    <canvas id="confetti"></canvas>
    <div class="glow-bg"></div>

    <div class="container">
        <h1>✨ LUCKY BLIND BOX ✨</h1>
        <p class="subtitle">วัดดวงของคุณวันนี้... จะเศรษฐีใหม่ หรือสายสลายมโน!</p>

        <div class="box-stage" id="boxStage">
            <div class="mystery-box" id="mysteryBox">🎁</div>
        </div>

        <button class="btn-open" id="openBtn" onclick="openBox()">เปิดกล่องสุ่มดวง (ฟรี!)</button>

        <div class="rate-info">
            ⚙️ <b>อัตราการดรอปปัจจุบัน (Dev Rate View):</b>
            <div class="rate-list" id="rateDisplay"></div>
        </div>
    </div>

    <!-- Modal ผลลัพธ์ -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <div class="prize-container" id="prizeDisplay">
                <!-- รูปหรือ Emoji จะถูกแทรกที่นี่ -->
            </div>
            <div class="prize-title" id="prizeTitle">ชื่อรางวัล</div>
            <p class="prize-desc" id="prizeDesc">รายละเอียดรางวัล</p>
            <button class="btn-close" onclick="closeModal()">ลองใหม่อีกที (แก้แค้น)</button>
        </div>
    </div>

    <script>
        // =============================================================
        // 🛠️ DEV CONFIG: ปรับอัตราออกของ (Drop Rate) และใส่ URL รูปภาพได้ที่นี่!
        // - สามารถใส่ imgUrl: 'https://...' แทนการใช้ Emoji ได้
        // - หากเว้น imgUrl เป็น '' ระบบจะแสดง icon (Emoji) แทน
        // =============================================================
        const REWARDS = [
            {
                id: 'salt',
                name: 'เกลือสมุทรบริสุทธิ์ 100%',
                weight: 99.999999999, // อัตราออก 99.999999999% (มหาโคตรเกลือ)
                icon: '🧂',
                imgUrl: 'https://s.isanook.com/wo/0/ud/51/259021/theadventagesofsalt.jpg?ip/crop/w670h402/q80/jpg', // ตัวอย่าง URL รูปภาพ
                color: '#94a3b8',
                desc: 'ยินดีด้วย! คุณได้รับเกลือคุณภาพดีเอาไว้ทาแผลใจ คืนนี้กินเกลือแทนข้าวไปก่อนนะ 5555+'
            },
            {
                id: 'dollar1',
                name: '1 Dollar ($1)',
                weight: 0.0000000008, // 0.00000008%
                icon: '💵',
                imgUrl: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcROL1lOTKZ6zt--26g7cBOZH6IjLEVwacJPGDugVsErdw&s=10', // หากเว้นว่างไว้ จะใช้ Emoji 💵 แทน
                color: '#4ade80',
                desc: 'โอ้โห! คุณคือผู้โชคดี 1 ในร้อยล้าน! ได้ $1 (ประมาณ 35 บาท) เอาไปซื้อมาม่าต้มยำกุ้งกินได้ 1 ซองถ้วน!'
            },
            {
                id: 'dollar1000',
                name: '1,000 Dollars ($1,000)',
                weight: 0.00000000019, // 0.000000019%
                icon: '💰',
                imgUrl: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS_XLoW4B1W3dDPpZn6lWs7Tr2yi6u8sWTFWvVvLWINTQ&s=10',
                color: '#facc15',
                desc: 'รวยแล้ววว! คุณสุ่มได้ $1,000! ...แต่เสียใจด้วยนะ นี่คือเว็บสิมูเลเตอร์ ไม่แจกจริงจ้า 😜'
            },
            {
                id: 'iphone19',
                name: 'iPhone 19 Pro Max',
                weight: 0.00000000001, // 0.000000001% (แรร์ระดับปาฏิหาริย์)
                icon: '📱',
                imgUrl: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRmByhkfKEgJNfRBTw36h50DgLSajsLFSP2TkewkT_fB4OH2nz5QEnav74&s=10',
                color: '#ec4899',
                desc: 'กล่องแตก!! ปาฏิหาริย์มีจริง คุณได้รับ iPhone 19 Pro Max! โปรดมารับสินค้าได้ในปี ค.ศ. 2027 นะน้อง!'
            }
        ];
        // =============================================================

        // ฟังก์ชันฟอร์แมตเปอร์เซ็นต์ให้แสดงทศนิยมอย่างถูกต้องแม้จะมีขนาดเล็กมาก
        function formatPercentage(weight, totalWeight) {
            const pct = (weight / totalWeight) * 100;
            if (pct >= 99.9) return pct.toFixed(9) + '%';
            if (pct >= 1) return pct.toFixed(2) + '%';
            // สำหรับเปอร์เซ็นต์ขนาดเล็กมาก เช่น 0.000000001%
            return pct.toFixed(11).replace(/0+$/, '').replace(/\.$/, '') + '%';
        }

        // แสดงอัตราการออกบนหน้าเว็บ
        function displayRates() {
            const totalWeight = REWARDS.reduce((sum, r) => sum + r.weight, 0);
            const rateDisplay = document.getElementById('rateDisplay');
            rateDisplay.innerHTML = REWARDS.map(r => {
                const percentStr = formatPercentage(r.weight, totalWeight);
                const visual = (r.imgUrl && r.imgUrl.trim() !== '') 
                    ? `<img src="${r.imgUrl}" class="rate-img-thumb" alt="${r.name}">` 
                    : r.icon;
                return `<span class="rate-item" style="color:${r.color}">${visual} ${r.name}: <b>${percentStr}</b></span>`;
            }).join('');
        }
        displayRates();

        let isOpening = false;

        // สุ่มรางวัลตาม Weight
        function getRandomReward() {
            const totalWeight = REWARDS.reduce((sum, r) => sum + r.weight, 0);
            let random = Math.random() * totalWeight;
            
            for (let reward of REWARDS) {
                if (random < reward.weight) {
                    return reward;
                }
                random -= reward.weight;
            }
            return REWARDS[0];
        }

        // ฟังก์ชันเปิดกล่อง
        function openBox() {
            if (isOpening) return;
            isOpening = true;

            const box = document.getElementById('mysteryBox');
            const btn = document.getElementById('openBtn');
            
            btn.disabled = true;
            btn.innerText = 'กำลังลุ้นดวงอันเค็มชื่น...';
            
            // เล่น Animation เขย่ากล่อง
            box.classList.add('shaking');

            // หน่วงเวลาให้ลุ้น 2.5 วินาที
            setTimeout(() => {
                box.classList.remove('shaking');
                const prize = getRandomReward();
                showResult(prize);
                
                btn.disabled = false;
                btn.innerText = 'เปิดกล่องสุ่มดวง (ฟรี!)';
                isOpening = false;
            }, 2500);
        }

        // คลิกที่กล่องเพื่อเปิดได้ด้วย
        document.getElementById('boxStage').addEventListener('click', openBox);

        // แสดง Pop-up ผลลัพธ์
        function showResult(prize) {
            const modal = document.getElementById('resultModal');
            const prizeDisplay = document.getElementById('prizeDisplay');
            const title = document.getElementById('prizeTitle');
            const desc = document.getElementById('prizeDesc');

            // แสดงผลรูปภาพ หรือ Emoji
            if (prize.imgUrl && prize.imgUrl.trim() !== '') {
                prizeDisplay.innerHTML = `<img src="${prize.imgUrl}" alt="${prize.name}" class="prize-img">`;
            } else {
                prizeDisplay.innerHTML = `<div class="prize-icon">${prize.icon}</div>`;
            }

            title.innerText = prize.name;
            title.style.color = prize.color;
            desc.innerText = prize.desc;

            modal.classList.add('active');

            // ถ้าไม่ได้เกลือ ให้ยิงพลุ Confetti
            if (prize.id !== 'salt') {
                fireConfetti();
            }
        }

        function closeModal() {
            document.getElementById('resultModal').classList.remove('active');
        }

        // =============================================================
        // Simple Particle Confetti System (ไม่ต้องพึ่งไลบรารีภายนอก)
        // =============================================================
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function fireConfetti() {
            particles = [];
            const colors = ['#f43f5e', '#8b5cf6', '#06b6d4', '#10b981', '#facc15'];
            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 18,
                    vy: (Math.random() - 0.5) * 18 - 5,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 100
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2; // Gravity
                p.life -= 1.5;

                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                if (p.life <= 0) particles.splice(index, 1);
            });

            if (particles.length > 0) {
                requestAnimationFrame(animateConfetti);
            }
        }
    </script>
</body>
</html>
